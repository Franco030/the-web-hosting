<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Web Hosting: hosting compartido, WordPress, VPS, cloud y servidores dedicados con soporte 24/7." />
    <meta name="theme-color" content="#456ad1" />
    <title>The Web Hosting</title>
    <style>
      /* Fondo previo a React: espejo de colorNeutralBackground2 de Fluent (claro / oscuro). */
      html { background: #fafafa; color-scheme: light; }
      html.dark { background: #1f1f1f; color-scheme: dark; }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('twh_theme');
          var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
